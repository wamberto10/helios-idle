<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>HELIOS IDLE</title>
  <meta name="description" content="Jogo idle incremental no Sistema Solar: produção, especialistas, enxame de Dyson e o Colapso.">
  <meta name="theme-color" content="#03060f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/ui/favicon.png">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div id="app">
    <header id="top"></header>
    <nav id="nav" aria-label="Telas principais"></nav>
    <main id="screen"></main>
  </div>
  <div id="modal"></div>
  <div id="toasts" aria-live="polite"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <button id="fxskip" class="btn fx-skip">Pular animação</button>
  <noscript>O HELIOS IDLE precisa de JavaScript ativado.</noscript>
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/session.js"></script>
  <script src="js/folder-save.js"></script>
  <script src="assets/manifest.js"></script>
  <script src="js/art.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app-bridge.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
